name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify www folder exists
        run: |
          echo "--- Root ---"
          ls -la
          echo "--- www/ ---"
          ls -la www/ || (echo "ERROR: www folder missing!" && exit 1)

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "--- sdkmanager location ---"
          which sdkmanager || find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -5

      - name: Accept ALL Android SDK licenses (non-interactive)
        run: |
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "License accepted (exit code ignored — might be SIGPIPE from yes)"
          # Verifikasi
          sdkmanager --licenses < /dev/null > /dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- Installed ---"
          ls /usr/local/lib/android/sdk/platforms/
          ls /usr/local/lib/android/sdk/build-tools/

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Redirect Gradle Download to Fast Mirror
        run: |
          WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          echo "Mengubah distributionUrl ke mirror Tencent..."
          sed -i 's|https\\://services.gradle.org/distributions/|https\\://mirrors.cloud.tencent.com/gradle/|g' $WRAPPER_FILE
          # Naikkan batas timeout jadi 60 detik (jaga-jaga)
          sed -i 's|networkTimeout=10000|networkTimeout=60000|g' $WRAPPER_FILE
          echo "--- Isi file wrapper setelah diubah ---"
          cat $WRAPPER_FILE

      - name: Patch AndroidManifest for Notifications
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          echo "Patch berhasil diterapkan."

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deadline-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
