name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept ALL Android SDK licenses (non-interactive)
        run: |
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --licenses < /dev/null > /dev/null 2>&1 || true

      - name: Install required SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AndroidManifest for Notifications & Update
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST
          sed -i '/<application/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' $MANIFEST

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      # --- SUNTIK GRADLE PAKAI SED (LEBIH STABIL) ---
      - name: Patch build.gradle for Release Signing
        run: |
          GRADLE_FILE="android/app/build.gradle"
          sed -i 's/buildTypes {/signingConfigs {\n        release {\n            storeFile file(System.getenv("KEYSTORE_PATH"))\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }\n    buildTypes {/' $GRADLE_FILE
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/' $GRADLE_FILE
          echo "--- HASIL PATCH GRADLE ---"
          grep -A 10 "signingConfigs {" $GRADLE_FILE
      # ----------------------------------------------

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo "--- CEK FILE APK YANG DIHASILKAN ---"
          ls -la app/build/outputs/apk/release/

      # --- TARGET UPLOAD DIGANTI JADI *.apk ---
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deadline-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          tag_name: v${{ github.run_number }}.0.0
          name: Release v${{ github.run_number }}.0.0
          body: |
            Update otomatis dari GitHub Actions.
            Build Number: #${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
